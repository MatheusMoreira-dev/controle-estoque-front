<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./global.css" />

    <!--Css Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!--Icons Bootstrap-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>Estoque</title>
  </head>

  <body class="overflow-y-hidden">
    <header class="container-md navbar navbar-expand-lg navbar-light px-4">
      <a class="navbar-brand" href="#">Home</a>
    </header>

    <main class="container-md p-4 h-100">
      <!--Cabeçalho-->
      <div class="d-flex justify-content-between gap-5 mb-4">
        <div class="input-group">
          <input id="pesquisa" type="text" class="form-control" />
          <button class="btn btn-secondary text-nowrap">
            <i class="bi bi-tag"></i>
          </button>
        </div>

        <button
          type="button"
          class="btn btn-primary text-nowrap"
          data-bs-toggle="modal"
          data-bs-target="#formNovoItem"
        >
          <i class="bi bi-plus"></i>
          <span class="d-none d-md-inline">Novo Item</span>
        </button>
      </div>

      <!--Filtros-->
      <div class="filtrosEstoque btn-group me-2 mb-2">
        <!--Todos-->
        <input
          id="filtroTodos"
          type="radio"
          value="todos"
          name="filtroEstoque"
          class="btn-check"
          checked
        />
        <label for="filtroTodos" class="btn btn-outline-primary text-nowrap"
          >Todos<span id="total-todos" class="badge bg-primary"></span
        ></label>

        <!--Com Estoque-->
        <input
          id="filtroComEstoque"
          type="radio"
          value="comEstoque"
          name="filtroEstoque"
          class="btn-check"
        />
        <label
          for="filtroComEstoque"
          class="btn btn-outline-primary text-nowrap"
          >Com Estoque
          <span id="total-com-estoque" class="badge bg-primary"></span
        ></label>

        <!--Sem Estoque-->
        <input
          id="filtroSemEstoque"
          type="radio"
          value="semEstoque"
          name="filtroEstoque"
          class="btn-check"
        />
        <label
          for="filtroSemEstoque"
          class="btn btn-outline-primary text-nowrap"
          >Sem Estoque
          <span id="total-sem-estoque" class="badge bg-primary"></span
        ></label>
      </div>

      <!--Lista de Cards-->
      <div class="container h-100 overflow-y-auto">
        <div
          id="cardsItensCatalogo"
          class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4"
        ></div>
      </div>
    </main>

    <!--Modal Form Novo Item-->
    <div
      class="modal fade"
      id="formNovoItem"
      tabindex="-1"
      aria-labelledby="formNovoItem"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title">Novo Item</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="close"
            ></button>
          </div>

          <div id="modalFormCadastro" class="modal-body"></div>
        </div>
      </div>
    </div>

    <!--OffCanvas Detalhes do item-->
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="detalhesItem"
      aria-labelledby="detalhesItem"
    >
      <div class="offcanvas-header">
        <button
          type="button"
          class="btn-close text-reset"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body"></div>
    </div>
  </body>

  <!--Script Bootstrap-->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./scripts/formNovoItem.js"></script>
  <script src="./scripts/insertComponents.js"></script>
</html>
